name: CI
# once per pull request (and each push to it), and on main; a push to a branch without a pull request runs nothing
on:
  push:
    branches: [main]
  pull_request:

# a newer push to the same pull request cancels the run it replaces
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # five machines at once: the unit tests on one, the browser tests split in four (they draw the globe in software,
  # which is slow, so they take about four times as long as everything else)
  build-and-test:
    name: build-and-test (${{ matrix.part }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        part: [unit, 1/4, 2/4, 3/4, 4/4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # the sources (Natural Earth, and the layers in scripts/sources from the mirror release) and the built data
      # change rarely; cache them
      - uses: actions/cache@v4
        with:
          path: |
            data/src
            data/*.bin
            data/admin1
            data/layers
          key: data-${{ hashFiles('scripts/fetch_*.js', 'scripts/build_*.js', 'scripts/lib/**', 'scripts/sources/**', 'src/overseas.js', 'package-lock.json') }}
      - name: Fetch and build data
        run: |
          [ -f data/src/ne_10m_admin_1_states_provinces.geojson ] || node scripts/fetch_data.js
          node scripts/fetch_sources.js
          [ -f data/tris.bin ] && [ -f data/phys.bin ] && [ -f data/admin1/index.json ] && [ -f data/layers/index.json ] || npm run data
      - run: npm run build
      - if: matrix.part == 'unit'
        run: npm run test:unit
      - if: matrix.part != 'unit'
        run: npx playwright install --with-deps chromium
      - if: matrix.part != 'unit'
        run: npx playwright test --shard=${{ matrix.part }}
        env:
          CI: '1'
      - uses: actions/upload-artifact@v4
        if: always() && matrix.part == 'unit'
        with:
          name: site
          path: dist
          retention-days: 7
